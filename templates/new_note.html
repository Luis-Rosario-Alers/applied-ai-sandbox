<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Note · Sandbox</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="form-page">
  <div class="page-wrapper">

    <h1>New note</h1>

    <form method="POST">
      <label for="title">Title</label>
      <input id="title" name="title" type="text"
             value="{{ title or '' }}"
             class="{% if errors and errors.get('title') %}has-error{% endif %}">
      {% if errors and errors.get('title') %}<span class="error">{{ errors['title'] }}</span>{% endif %}

      <label for="body">Body</label>
      <textarea id="body" name="body" rows="6"
                class="{% if errors and errors.get('body') %}has-error{% endif %}">{{ body or '' }}</textarea>
      {% if errors and errors.get('body') %}<span class="error">{{ errors['body'] }}</span>{% endif %}

      <label for="tags">Tags <span style="font-weight:400;color:var(--color-text-muted)">(comma-separated, optional)</span></label>
      <input id="tags" name="tags" type="text" value="{{ tags or '' }}">

      <div class="actions">
        <button type="submit" class="btn">Save note</button>
        <a href="{{ url_for('home') }}" class="cancel-link">Cancel</a>
      </div>
    </form>

  </div>
</body>
</html>
